name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: closetcloud-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print tool versions and verify project files
        run: |
          node --version
          npm --version
          test -f package.json
          test -f tsconfig.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript verification
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
